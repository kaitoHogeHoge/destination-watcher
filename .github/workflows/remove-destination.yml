# Actions ページから都市名を入れて、行き先を削除する
name: 行き先を削除

on:
  workflow_dispatch:
    inputs:
      name:
        description: "画面に出ている都市名（例：バンコク）。同じ名前が複数あるときは id"
        required: true
        type: string

permissions:
  contents: write
  actions: write   # 「データ更新」を呼び出すため

# 「データ更新」と同じ concurrency グループには入れない。
# GitHub は待ちの実行を1つしか残さず、後から来た実行が待ちの実行を黙って取り消してしまうため。
# 2つの追加・削除が同時に動いてぶつかった場合は、保存の手順が ❌ で止まる（もう一度実行すればよい）。

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: ライブラリを入れる
        run: pip install -r requirements.txt

      # 入力は環境変数で渡す（入力に記号が入っていても、コマンドとして実行されないようにするため）
      - name: 行き先を削除する
        env:
          NAME: ${{ inputs.name }}
        run: python -m fetcher.remove --name="$NAME"

      - name: 設定とデータの削除を保存する
        env:
          NAME: ${{ inputs.name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A config/destinations.json site/data
          git commit -m "行き先を削除：$NAME"
          git pull --rebase origin main
          git push

      - name: データ更新を呼び出す
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update.yml --ref main
